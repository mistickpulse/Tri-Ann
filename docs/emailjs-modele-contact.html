<div style="margin:0; padding:24px 12px; background-color:#f3efe9; font-family:system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; color:#2b2522;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; margin:0 auto; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e4ddd4;">
    <tr>
      <td style="background-color:#1c1816; padding:18px 24px;">
        <div style="color:#8fa8b5; font-size:12px; font-weight:700; letter-spacing:1px; text-transform:uppercase;">Site Tri-Ann · Nouveau message</div>
        <div style="color:#ffffff; font-size:20px; font-weight:700; margin-top:4px;">À transmettre à : {{restaurant_label}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:22px 24px 6px;">
        <div style="font-size:14px; color:#6b625b;">Objet</div>
        <div style="font-size:17px; font-weight:700; margin-top:2px;">{{subject}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:14px 24px;">
        <div style="background-color:#f7f4f0; border-left:4px solid #8fa8b5; border-radius:6px; padding:14px 16px; font-size:15px; line-height:1.6; white-space:pre-line;">{{message}}</div>
      </td>
    </tr>
    <tr>
      <td style="padding:6px 24px 22px;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="font-size:14px; line-height:1.7;">
          <tr><td style="color:#6b625b; padding-right:14px;">Nom</td><td style="font-weight:700;">{{from_name}}</td></tr>
          <tr><td style="color:#6b625b; padding-right:14px;">E-mail</td><td><a href="mailto:{{reply_to}}" style="color:#4a6b7c;">{{reply_to}}</a></td></tr>
          <tr><td style="color:#6b625b; padding-right:14px;">Téléphone</td><td><a href="tel:{{phone}}" style="color:#4a6b7c;">{{phone}}</a></td></tr>
          <tr><td style="color:#6b625b; padding-right:14px;">Restaurant</td><td>{{restaurant_label}}</td></tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:14px 24px; background-color:#f7f4f0; font-size:12px; color:#8a817a;">
        Pour répondre au client, utilisez simplement « Répondre » : la réponse part directement à son adresse.
      </td>
    </tr>
  </table>
</div>
