# Construit le site avec Eleventy puis le publie sur GitHub Pages
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Chaque matin : mise à jour des avis Google (6 h, heure de Paris en hiver)
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      # Derniers avis connus, gardés d'un déploiement à l'autre (si Google ne répond pas, on les réutilise)
      - name: Restore Google reviews
        uses: actions/cache@v4
        with:
          path: src/_data/googleReviews.json
          key: google-reviews-${{ github.run_id }}
          restore-keys: google-reviews-
      - name: Fetch Google reviews
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: node scripts/fetch-reviews.mjs
      - name: Build
        # Sous-dossier du dépôt sur github.io. Avec un nom de domaine perso : PATH_PREFIX: /
        env:
          PATH_PREFIX: /Tri-Ann/
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
